# Builds Warpline's desktop beta on macOS (Audio Unit + VST3, Apple Silicon and Intel), checks the AU with Apple's
# auval, and attaches the zip to the run. Started by hand (Actions > Desktop macOS > Run workflow), by a push to the desktop-beta branch, or by a desktop-* tag.
name: Desktop macOS

on:
  workflow_dispatch:
  push:
    branches: [ "desktop-beta" ]
    tags: [ "desktop-*" ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S desktop -B build/desktop -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build/desktop --config Release --parallel 4 -- -quiet

      - name: Sign (ad hoc) and collect
        run: |
          set -e
          ART=build/desktop/Warpline_artefacts/Release
          mkdir -p out
          for b in "$ART/AU/Warpline.component" "$ART/VST3/Warpline.vst3"; do
            codesign --force --sign - "$b/Contents/Resources/VST/warpline.dylib"
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
            cp -R "$b" out/
          done
          lipo -info "$ART/AU/Warpline.component/Contents/MacOS/Warpline" "$ART/AU/Warpline.component/Contents/Resources/VST/warpline.dylib"

      - name: Validate the Audio Unit (auval)
        run: |
          set -e
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R out/Warpline.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -a | grep -i warpline || true
          auval -v aumu Wrpl Clvr

      - name: Zip
        run: |
          cp desktop/README.md out/README.md
          cd out && ditto -c -k --keepParent . ../Warpline-desktop-macos.zip

      # Copies the zip into a Google Drive folder when the repo has the secrets GDRIVE_TOKEN (rclone's token for the
      # account, from `rclone authorize "drive"`) and GDRIVE_FOLDER_ID (the folder's id from its URL). Skipped without them.
      - name: Upload to Google Drive
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_TOKEN" ] || [ -z "$GDRIVE_FOLDER_ID" ]; then echo "No Google Drive secrets: skipped."; exit 0; fi
          brew install rclone >/dev/null
          VERSION=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          NAME="Warpline-${VERSION}-desktop-macos-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.zip"
          cp Warpline-desktop-macos.zip "$NAME"
          export RCLONE_CONFIG_GDRIVE_TYPE=drive RCLONE_CONFIG_GDRIVE_SCOPE=drive
          export RCLONE_CONFIG_GDRIVE_TOKEN="$GDRIVE_TOKEN" RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"
          rclone copy "$NAME" gdrive: --drive-chunk-size 64M --stats-one-line -v
          echo "Uploaded $NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: Warpline-desktop-macos
          path: Warpline-desktop-macos.zip
          retention-days: 30
