# Builds Warpline's desktop beta on macOS (Audio Unit + VST3, Apple Silicon and Intel), checks the AU with Apple's
# auval, and attaches the zip to the run. Started by hand (Actions > Desktop macOS > Run workflow), by a push to the desktop-beta branch, or by a desktop-* tag.
name: Desktop macOS

on:
  workflow_dispatch:
  push:
    branches: [ "desktop-beta" ]
    tags: [ "desktop-*" ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode 15 (JUCE 7 does not build against the macOS 15 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 15 on this runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Configure
        run: cmake -S desktop -B build/desktop -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build/desktop --config Release --parallel 4 -- -quiet

      - name: Sign (ad hoc) and collect
        run: |
          set -e
          ART=build/desktop/Warpline_artefacts/Release
          mkdir -p out
          for b in "$ART/AU/Warpline.component" "$ART/VST3/Warpline.vst3"; do
            codesign --force --sign - "$b/Contents/Resources/VST/warpline.dylib"
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
            cp -R "$b" out/
          done
          lipo -info "$ART/AU/Warpline.component/Contents/MacOS/Warpline" "$ART/AU/Warpline.component/Contents/Resources/VST/warpline.dylib"

      - name: Validate the Audio Unit (auval)
        run: |
          set -e
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R out/Warpline.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -a | grep -i warpline || true
          auval -v aumu Wrpl Clvr

      - name: Zip
        run: |
          cp desktop/README.md out/README.md
          cd out && ditto -c -k --keepParent . ../Warpline-desktop-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Warpline-desktop-macos
          path: Warpline-desktop-macos.zip
          retention-days: 30
